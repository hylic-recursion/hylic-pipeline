[package]
name = "hylic-pipeline"
version = "0.8.0"
edition = "2021"
rust-version = "1.75"
description = "Typestate pipelines and sugar traits over hylic lifts."
license = "MIT"
readme = "README.md"
repository = "https://github.com/hylic-recursion/hylic-pipeline"
homepage = "https://hylic-recursion.github.io/hylic-docs/"
documentation = "https://hylic-recursion.github.io/hylic-docs/pipeline/overview.html"
keywords = ["recursion-schemes", "pipeline", "typestate", "tree", "fold"]
categories = ["data-structures", "algorithms", "rust-patterns"]
exclude = ["KB/**", "__Scratch__", "notes.txt", "doc/**", ".plans/**"]

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[dependencies]
hylic = "0.8"
either = "1.15.0"

[dev-dependencies]
