name: CI

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

env:
  CARGO_TERM_COLOR: always

# hylic-pipeline depends on hylic via path + version. cargo resolves
# path locally; standalone clones fall through to crates.io. The CI
# expects hylic to be on crates.io — the first push will be red
# until the v0.8 publish chain reaches this crate.

jobs:
  check:
    name: cargo check + clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo check --all-targets
      - run: cargo clippy --all-targets -- -D warnings
