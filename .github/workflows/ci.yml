name: CI

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

env:
  CARGO_TERM_COLOR: always

# hylic-pipeline depends on hylic via path = "../hylic". CI co-checks
# out hylic alongside hylic-pipeline so cargo's path-deps resolve
# without needing hylic to be on crates.io yet.

jobs:
  check:
    name: cargo check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout hylic-pipeline
        uses: actions/checkout@v4
        with:
          path: hylic-pipeline
      - name: Checkout hylic
        uses: actions/checkout@v4
        with:
          repository: simlei/hylic
          path: hylic
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: hylic-pipeline
      - name: cargo check
        working-directory: hylic-pipeline
        run: cargo check --all-targets
